name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build pages
        run: node build.js
      - name: Optimize images (WebP, responsive sizes)
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node optimize-images.js
      - name: Add self-hosted fonts (Manrope)
        run: |
          npm install --no-save --no-audit --no-fund @fontsource-variable/manrope
          mkdir -p site/fonts
          cp node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2 site/fonts/
          cp node_modules/@fontsource-variable/manrope/files/manrope-latin-ext-wght-normal.woff2 site/fonts/
          ls -la site/fonts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
